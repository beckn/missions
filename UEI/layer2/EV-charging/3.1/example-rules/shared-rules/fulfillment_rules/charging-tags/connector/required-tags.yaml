#structure it like u did for search SETTLEMENT_TERMS
properties:
  message:
    properties:
      order:
        properties:
          items:
            items:
              properties:
                tags:
                  items:
                    if:
                      properties:
                        descriptor:
                          properties:
                            code:
                              const: connector-specifications
                    then:
                      properties:
                        list: # there should not be a "type: array" block below this. dont know the reason yet.
                          allOf:
                            - contains:
                                type: object
                                properties:
                                  descriptor:
                                    type: object
                                    properties:
                                      code:
                                        const: connector-id
                                    required:
                                      - code
                                required:
                                  - descriptor
                                  - value
                            - contains:
                                type: object
                                properties:
                                  descriptor:
                                    type: object
                                    properties:
                                      code:
                                        const: power-type
                                    required:
                                      - code
                                  value:
                                    type: string
                                    enum:
                                      - AC_1_PHASE
                                      - AC_2_PHASE
                                      - AC_2_PHASE_SPLIT
                                      - AC_3_PHASE
                                      - DC
                                required:
                                  - value
                            - contains:
                                type: object
                                properties:
                                  descriptor:
                                    type: object
                                    properties:
                                      code:
                                        const: connector-format
                                    required:
                                      - code
                                  value:
                                    type: string
                                    enum:
                                      - SOCKET
                                      - CABLE
                                required:
                                  - value
                            - contains:
                                type: object
                                properties:
                                  descriptor:
                                    type: object
                                    properties:
                                      code:
                                        const: status
                                    required:
                                      - code
                                  value:
                                    type: string
                                    enum:
                                      - Available
                                      - Unavailable
                                      - Reserved
                                required:
                                  - value
                            - contains:
                                type: object
                                properties:
                                  descriptor:
                                    type: object
                                    properties:
                                      code:
                                        const: connector-type
                                    required:
                                      - code
                                  value:
                                    type: string
                                    enum:
                                      - CHADEMO
                                      - DOMESTIC_A
                                      - DOMESTIC_B
                                      - DOMESTIC_C
                                      - DOMESTIC_D
                                      - DOMESTIC_E
                                      - DOMESTIC_F
                                      - DOMESTIC_G
                                      - DOMESTIC_H
                                      - DOMESTIC_I
                                      - DOMESTIC_J
                                      - DOMESTIC_K
                                      - DOMESTIC_L
                                      - DOMESTIC_M
                                      - DOMESTIC_N
                                      - DOMESTIC_O
                                      - IEC_60309_2_single_16
                                      - IEC_60309_2_three_16
                                      - IEC_60309_2_three_32
                                      - IEC_60309_2_three_64
                                      - IEC_62196_T1
                                      - IEC_62196_T1_COMBO
                                      - IEC_62196_T2
                                      - IEC_62196_T2_COMBO
                                      - IEC_62196_T3A
                                      - IEC_62196_T3C
                                      - TESLA_R
                                      - TESLA_S
                                      - CCS2
                                required:
                                  - value