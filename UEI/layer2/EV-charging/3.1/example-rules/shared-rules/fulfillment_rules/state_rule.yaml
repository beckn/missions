properties:
  message:
    properties:
      order:
        properties:
          fulfillments:
            type: array
            minItems: 1
            items:
              type: object
              properties:
                state:
                  type: object
                  properties:
                    descriptor:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - ACTIVE
                            - COMPLETED
                            - INVALID
                            - PENDING
                            - RESERVATION
                      required:
                        - code
