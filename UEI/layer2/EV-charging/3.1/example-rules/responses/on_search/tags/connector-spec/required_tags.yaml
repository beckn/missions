properties:
  message:
    properties:
      catalog:
        properties:
          providers:
            items:
              properties:
                items:
                  type: array
                  items:
                    properties:
                      tags:
                        items:
                          if:
                            properties:
                              descriptor:
                                properties:
                                  code:
                                    const: connector-specifications
                          then:
                            properties:
                              list: # there should not be a "type: array" block below this. dont know the reason yet.
                                allOf:
                                  - contains:
                                      type: object
                                      properties:
                                        descriptor:
                                          type: object
                                          properties:
                                            code:
                                              const: connector-id
                                          required:
                                            - code
                                        value:
                                          type: string
                                      required:
                                        - descriptor
                                        - value
                                  - contains:
                                      type: object
                                      properties:
                                        descriptor:
                                          type: object
                                          properties:
                                            code:
                                              const: connector-type
                                          required:
                                            - code
                                        value:
                                          type: string
                                      required:
                                        - descriptor
                                        - value
                                  - contains:
                                        type: object
                                        properties:
                                          descriptor:
                                            type: object
                                            properties:
                                              code:
                                                const: power-type
                                            required:
                                              - code
                                          value:
                                            type: string
                                        required:
                                          - descriptor
                                          - value